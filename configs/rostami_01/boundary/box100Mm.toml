# Regularized QG analogue of the 2017 circular-flow initial-value experiment; not an exact shallow-water reproduction.
[boundary]
inner_radius_m = 3.5e7
outer_radius_m = 4.5e7
sponge_rate_s = 0.0

[convection]
bias_max = 0.25
enabled = false
interval_max_s = 2000.0
interval_min_s = 1000.0
psi_limit_m2_s = 1.0e9
q_max_s = 2.0e-5
r_max_m = 2.0e7
r_min_m = 8.0e6
vortex_radius_m = 250000.0

[experiment]
name = "boundary__box100Mm"
purpose = "selection"
seed = 42

[grid]
length_m = 1.0e8
nx = 1280

[initial]
core_regularization_m = 500000.0
cyclone_radius_m = 1.3418161281040933e6
cyclone_speed_m_s = 153.6
displacement_m = 10000.0
jet_radius_m = 1.0784e7
jet_speed_m_s = 81.92
jet_width_m = 1.8475208614068027e6
m_max = 8
m_min = 2
mode = 6
perturbation = "broadband"
profile = "rostami2017"

[numerics]
cfl_limit = 0.6
cutoff_damping_time_s = 100470.44901557114
dt_s = 25.0
duration_s = 3.125e6
hyper_order = 4

[output]
checkpoint_interval_s = 200000.0
diagnostic_interval_s = 2000.0
jet_search_halfwidth_m = 4.0e6
m_max = 32
nr = 256
ntheta = 720
snapshot_interval_s = 50000.0

[physics]
deep_cyclone_fraction = 0.0
deep_jet_fraction = 0.0
deep_jet_radius_m = 1.5e7
deep_jet_speed_m_s = 0.0
deep_jet_width_m = 1.0e6
deep_profile = "matched_components"
deformation_radius_m = 3.2e6

[planet]
radius_m = 5.5e7
rotation_rate_s = 0.00016
