# Deliberately coarse, synthetic integration check; not a Saturn inference run.
[experiment]
name = "smoke"
purpose = "smoke"
seed = 42

[grid]
nx = 64
length_m = 60000000.0

[planet]
radius_m = 60000000.0
rotation_rate_s = 0.000165

[physics]
deformation_radius_m = 2000000.0
deep_jet_speed_m_s = 50.0
deep_jet_radius_m = 12000000.0
deep_jet_width_m = 3000000.0

[initial]
jet_speed_m_s = 100.0
jet_radius_m = 12000000.0
jet_width_m = 3000000.0
cyclone_speed_m_s = 30.0
cyclone_radius_m = 3000000.0
perturbation = "mode"
displacement_m = 300000.0
mode = 6
m_max = 12

[boundary]
inner_radius_m = 21000000.0
outer_radius_m = 26000000.0
sponge_rate_s = 0.0

[numerics]
dt_s = 20.0
duration_s = 400.0
hyper_order = 4
cutoff_damping_time_s = 100000.0
cfl_limit = 0.6

[convection]
# Large resolved vortices are synthetic: do not copy this radius to a study.
enabled = true
r_min_m = 3000000.0
r_max_m = 10000000.0
vortex_radius_m = 4000000.0
q_max_s = 0.000002
bias_max = 0.25
psi_limit_m2_s = 1000000000.0
interval_min_s = 70.0
interval_max_s = 90.0

[output]
diagnostic_interval_s = 80.0
snapshot_interval_s = 200.0
checkpoint_interval_s = 200.0
m_max = 12
ntheta = 96
nr = 32
jet_search_halfwidth_m = 7000000.0
