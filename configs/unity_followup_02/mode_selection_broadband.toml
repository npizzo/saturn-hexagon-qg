# Prepared for later scientific review; not the next job and not authorized for automatic submission.
# Small broadband perturbations test mode selection of an existing jet and cyclone.
# This is not convection-driven emergence; convection remains disabled.
[experiment]
name = "unity-broadband-selection"
purpose = "selection"
seed = 42

[grid]
nx = 1024
length_m = 60000000.0

[planet]
radius_m = 60000000.0
rotation_rate_s = 0.000165

[physics]
deformation_radius_m = 2000000.0
deep_jet_speed_m_s = 50.0
deep_jet_radius_m = 15000000.0
deep_jet_width_m = 1000000.0

[initial]
jet_speed_m_s = 100.0
jet_radius_m = 15000000.0
jet_width_m = 1000000.0
cyclone_speed_m_s = 50.0
cyclone_radius_m = 3000000.0
perturbation = "broadband"
displacement_m = 10000.0
mode = 6
m_max = 32

[boundary]
inner_radius_m = 24000000.0
outer_radius_m = 28000000.0
sponge_rate_s = 0.0

[numerics]
dt_s = 50.0
duration_s = 1000000.0
hyper_order = 4
cutoff_damping_time_s = 100000.0
cfl_limit = 0.6

[convection]
enabled = false
r_min_m = 8000000.0
r_max_m = 20000000.0
# 250 km is 4.27 cells at this resolution: minimum resolution, not convergence.
vortex_radius_m = 250000.0
q_max_s = 0.00002
bias_max = 0.25
psi_limit_m2_s = 1000000000.0
interval_min_s = 1000.0
interval_max_s = 2000.0

[output]
diagnostic_interval_s = 10000.0
snapshot_interval_s = 100000.0
checkpoint_interval_s = 100000.0
m_max = 32
ntheta = 360
nr = 128
jet_search_halfwidth_m = 4000000.0
